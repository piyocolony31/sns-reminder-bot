name: Check Kogetsu Sunday Vacancy

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *' # 毎時15分に実行

jobs:
  check_vacancy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Kogetsu Sunday Vacancy Checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_AUTOCHECK_URL }}
        run: python check-kogetsu-vacancy/main.py

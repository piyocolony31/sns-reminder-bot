name: Check SacsBar Sale Wallets

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 毎日日本時間9:00 (UTC 0:00) に実行

jobs:
  check_sale_wallets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip dependencies
        run: pip install -r check-sacsbar-sale-wallets/requirements.txt

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('check-sacsbar-sale-wallets/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Run Sacs Bar Sale Wallet Checker
        env:
          DISCORD_WEBHOOK_AUTOCHECK_URL: ${{ secrets.DISCORD_WEBHOOK_AUTOCHECK_URL }}
        run: python check-sacsbar-sale-wallets/main.py

      - name: Commit and push updated known_wallets.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add check-sacsbar-sale-wallets/known_wallets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update SacsBar known sale wallets" && git push)
